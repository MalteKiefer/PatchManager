# Tool configuration only. Dependencies and tasks live in pixi.toml.

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "DJ", "N", "C4", "SIM", "PT", "RUF", "ANN", "D"]
# D401: "True if ..." docstrings read better for predicates. RUF012: Django Meta/form idioms.
ignore = ["D100", "D104", "D105", "D106", "D107", "D203", "D213", "D401", "ANN401", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D", "ANN", "PT018"]
"src/patchmanager/*/migrations/*" = ["D", "ANN", "E501", "RUF012", "N806"]
"scripts/*" = ["D"]
"src/patchmanager/*/management/commands/*" = ["D101", "D102"]
"manage.py" = ["D"]
"src/patchmanager/{urls,wsgi,gunicorn_conf}.py" = ["D"]
"src/patchmanager/*/apps.py" = ["D"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "patchmanager.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
django_find_project = false
testpaths = ["tests"]
markers = ["e2e: browser tests (Playwright), run with -m e2e"]
addopts = "-m 'not e2e' --strict-markers --cov=patchmanager --cov-report=term-missing --cov-fail-under=90"
# collectstatic only runs in the image build, not before tests.
filterwarnings = ["error", "ignore:No directory at:UserWarning"]

[tool.coverage.run]
branch = true
omit = ["src/patchmanager/wsgi.py", "src/patchmanager/gunicorn_conf.py"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pyright]
venvPath = ".pixi/envs"
venv = "dev"
extraPaths = ["src"]

# Tests use untyped pytest fixtures and Django's dynamic test client attributes.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["attr-defined", "arg-type", "union-attr", "misc", "no-untyped-call"]

# No type information published for these libraries.
[[tool.mypy.overrides]]
module = ["celery", "celery.*", "qrcode", "qrcode.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true
