# Run via pixi: `pixi run -e dev pre-commit` (all files) or
# `pixi run -e dev pre-commit install` once to run on every commit.
# Vendored assets keep their upstream bytes (checksums in docs/STACK.md).
exclude: ^(src/patchmanager/core/static/vendor/|tests/e2e/vendor/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--unsafe] # mkdocs.yml uses !!python tags
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: pixi run -e lint typecheck
        language: system
        types: [python]
        pass_filenames: false
