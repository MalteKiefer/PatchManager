{% if messages %}
<ul class="mb-4 space-y-2" role="status">
  {% for message in messages %}
  <li class="rounded-md border px-4 py-2 text-sm {% if message.level_tag == 'error' %}border-red-200 bg-red-50 text-red-800 dark:border-red-900 dark:bg-red-950 dark:text-red-200{% elif message.level_tag == 'warning' %}border-amber-200 bg-amber-50 text-amber-900 dark:border-amber-900 dark:bg-amber-950 dark:text-amber-200{% else %}border-emerald-200 bg-emerald-50 text-emerald-900 dark:border-emerald-900 dark:bg-emerald-950 dark:text-emerald-200{% endif %}">{{ message }}</li>
  {% endfor %}
</ul>
{% endif %}
