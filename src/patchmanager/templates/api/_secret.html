{% load i18n %}{% if new_secret %}
<section class="card mb-6 border-amber-300 dark:border-amber-700" aria-labelledby="secret-h" role="alert">
  <h2 id="secret-h">{% translate "Copy it now" %}</h2>
  <p class="mt-1 text-sm">{% translate "It is shown only once. Store it in a secret manager." %}</p>
  <dl class="mt-3 grid gap-1 text-sm">{% for key, value in new_secret.items %}<dt class="font-semibold">{{ key }}</dt><dd class="break-all rounded bg-slate-100 px-2 py-1 font-mono dark:bg-slate-800">{{ value }}</dd>{% endfor %}</dl>
</section>
{% endif %}
