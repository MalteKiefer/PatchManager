# Production stack. See docs/guides/deployment.md.
#   1. Create secrets:   ./secrets/postgres_password, ./secrets/django_secret_key
#   2. Set PATCHMANAGER_DOMAIN (and optionally PATCHMANAGER_IMAGE) in .env
#   3. docker compose -f compose.prod.yaml up -d

name: patchmanager

x-app: &app
  image: ${PATCHMANAGER_IMAGE:-ghcr.io/maltekiefer/patchmanager:latest}
  read_only: true
  tmpfs: ["/tmp", "/dev/shm"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  networks: [backend]
  secrets: [postgres_password, django_secret_key]
  environment:
    PATCHMANAGER_ALLOWED_HOSTS: ${PATCHMANAGER_DOMAIN:?set PATCHMANAGER_DOMAIN}
    PATCHMANAGER_CSRF_TRUSTED_ORIGINS: https://${PATCHMANAGER_DOMAIN}
    # Only Caddy can reach the app, on the internal network.
    PATCHMANAGER_FORWARDED_ALLOW_IPS: "*"
    DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
    DATABASE_URL: postgresql://patchmanager@postgres:5432/patchmanager
    DATABASE_PASSWORD_FILE: /run/secrets/postgres_password

services:
  migrate:
    <<: *app
    restart: "no"
    entrypoint: ["/app/.pixi/envs/prod/bin/python", "-m", "django", "migrate", "--noinput"]
    depends_on:
      postgres: { condition: service_healthy }

  app:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }

  postgres:
    image: postgres:18.6-trixie@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    restart: unless-stopped
    networks: [backend]
    secrets: [postgres_password]
    environment:
      POSTGRES_USER: patchmanager
      POSTGRES_DB: patchmanager
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchmanager -d patchmanager"]
      interval: 10s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    read_only: true
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      PATCHMANAGER_DOMAIN: ${PATCHMANAGER_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    networks: [frontend, backend]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }

  # Daily logical dump, 14 days kept. Encrypt the backup volume at the host level
  # or ship dumps off-site; see docs/guides/deployment.md.
  backup:
    image: postgres:18.6-trixie@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    restart: unless-stopped
    networks: [backend]
    secrets: [postgres_password]
    environment:
      PGHOST: postgres
      PGUSER: patchmanager
      PGDATABASE: patchmanager
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    entrypoint: ["sh", "-c", "while true; do /usr/local/bin/backup.sh; sleep 86400; done"]
    depends_on:
      postgres: { condition: service_healthy }

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  django_secret_key:
    file: ./secrets/django_secret_key
