# Production stack. See docs/guides/deployment.md.
#   1. Create secrets in ./secrets/ (see the deployment guide)
#   2. Set PATCHMANAGER_DOMAIN (and optionally PATCHMANAGER_IMAGE) in .env
#   3. docker compose -f compose.prod.yaml up -d

name: patchmanager

x-app: &app
  image: ${PATCHMANAGER_IMAGE:-ghcr.io/maltekiefer/patchmanager:latest}
  read_only: true
  tmpfs: ["/tmp", "/dev/shm"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  networks: [backend]
  volumes: ["media:/app/media", "backups:/backups:ro"]
  secrets: [postgres_password, django_secret_key, encryption_keys, email_password]
  environment:
    PATCHMANAGER_BASE_URL: https://${PATCHMANAGER_DOMAIN:?set PATCHMANAGER_DOMAIN}
    PATCHMANAGER_ALLOWED_HOSTS: ${PATCHMANAGER_DOMAIN}
    PATCHMANAGER_CSRF_TRUSTED_ORIGINS: https://${PATCHMANAGER_DOMAIN}
    # Only Caddy can reach the app, on the internal network.
    PATCHMANAGER_FORWARDED_ALLOW_IPS: "*"
    DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
    PATCHMANAGER_ENCRYPTION_KEYS_FILE: /run/secrets/encryption_keys
    DATABASE_URL: postgresql://patchmanager@postgres:5432/patchmanager
    DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    REDIS_URL: redis://redis:6379/0
    PATCHMANAGER_EMAIL_HOST: ${PATCHMANAGER_EMAIL_HOST:-localhost}
    PATCHMANAGER_EMAIL_PORT: ${PATCHMANAGER_EMAIL_PORT:-587}
    PATCHMANAGER_EMAIL_USER: ${PATCHMANAGER_EMAIL_USER:-}
    PATCHMANAGER_EMAIL_PASSWORD_FILE: /run/secrets/email_password
    PATCHMANAGER_EMAIL_FROM: ${PATCHMANAGER_EMAIL_FROM:-patchmanager@localhost}
    PATCHMANAGER_BACKUP_DIR: /backups
    PATCHMANAGER_EDITION: ${PATCHMANAGER_EDITION:-}

services:
  migrate:
    <<: *app
    restart: "no"
    entrypoint: ["/app/.pixi/envs/prod/bin/python", "-m", "django", "migrate", "--noinput"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  app:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }

  worker:
    <<: *app
    entrypoint: ["/app/.pixi/envs/prod/bin/celery", "-A", "patchmanager.worker", "worker", "--loglevel", "INFO", "--concurrency", "2"]
    healthcheck:
      test: ["CMD", "/app/.pixi/envs/prod/bin/celery", "-A", "patchmanager.worker", "inspect", "ping", "--timeout", "5"]
      interval: 60s
      timeout: 15s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  scheduler:
    <<: *app
    entrypoint: ["/app/.pixi/envs/prod/bin/celery", "-A", "patchmanager.worker", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  postgres:
    image: postgres:18.6-trixie@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    restart: unless-stopped
    networks: [backend]
    secrets: [postgres_password, postgres_superuser_password]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-patchmanager.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patchmanager"]
      interval: 10s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    read_only: true
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      PATCHMANAGER_DOMAIN: ${PATCHMANAGER_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    networks: [frontend, backend]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }

  # Daily logical dump, 14 days kept. Runs as the superuser, which is not
  # subject to Row Level Security. Encrypt the backup volume at the host level
  # or ship dumps off-site; see docs/guides/deployment.md.
  backup:
    image: postgres:18.6-trixie@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    restart: unless-stopped
    networks: [backend]
    secrets: [postgres_superuser_password]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: patchmanager
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
      - media:/media:ro
    entrypoint: ["sh", "-c", "while true; do /usr/local/bin/backup.sh; sleep 86400; done"]
    depends_on:
      postgres: { condition: service_healthy }

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgdata:
  media:
  backups:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password
  django_secret_key:
    file: ./secrets/django_secret_key
  encryption_keys:
    file: ./secrets/encryption_keys
  email_password:
    file: ./secrets/email_password
