[workspace]
name = "patchmanager"
version = "1.0.0"
description = "Self-hosted network and rack documentation platform"
authors = ["Malte Kiefer"]
license = "AGPL-3.0-only"
channels = ["conda-forge"]
platforms = [{ name = "osx-arm64-macos13", platform = "osx-arm64", macos = "13.3" }, "linux-64", "linux-aarch64"]

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"
DJANGO_SETTINGS_MODULE = "patchmanager.settings"

# Runtime dependencies, shared by every environment.
[dependencies]
python = "3.14.*"
django = ">=6.1.2,<6.2"
psycopg = ">=3.3.4,<4"
gunicorn = ">=26.2.0,<27"
whitenoise = ">=6.12.0,<7"
argon2-cffi = ">=25.1.0,<26"
pyotp = ">=2.10.0,<3"
webauthn = ">=3.0.1,<4"
qrcode = ">=8.2,<9"
cryptography = "*"
celery = ">=5.6.3,<6"
redis-py = ">=8.1.0,<9"
prometheus_client = ">=0.26.0,<0.27"
pyyaml = ">=6.0.3,<7"
pillow = ">=13.0.0,<14"
nh3 = ">=0.3.7,<0.4"
markdown-it-py = ">=4.2.0,<5"
defusedxml = ">=0.7.1,<0.8"
pypdfium2 = ">=5.13.0,<6"
openpyxl = ">=3.1.5,<4"
reportlab = ">=5.0.1,<6"
djangorestframework = ">=3.18.3,<4"
drf-spectacular = ">=0.30.0,<0.31"
joserfc = ">=1.7.7,<2"
requests = ">=2.34.2,<3"
pysaml2 = ">=7.5.5,<8"
libxmlsec1 = ">=1.3.12,<2"
python-ldap = ">=3.4.8,<4"
django-storages = ">=1.14.6,<2"
boto3 = ">=1.43.114,<2"
restic = ">=0.19.1,<0.20"

[tasks]
check = "python -m django check --deploy --fail-level WARNING"
makemigrations = "python -m django makemigrations"

# Local PostgreSQL and Redis from conda-forge, see docs/adr/0004.
[feature.db.dependencies]
postgresql = ">=18.6,<19"
redis-server = ">=8.10.2,<9"

[feature.db.activation.env]
PGDATA = "$PIXI_PROJECT_ROOT/.pixi/pgdata"
PGHOST = "$PIXI_PROJECT_ROOT/.pixi"
PGPORT = "5433"
PGUSER = "patchmanager"
DATABASE_URL = "postgresql://patchmanager@/patchmanager?host=$PIXI_PROJECT_ROOT/.pixi&port=5433"

[feature.db.tasks]
db-init = "sh scripts/db.sh init"
db-start = { cmd = "sh scripts/db.sh start", depends-on = ["db-init"] }
db-stop = "sh scripts/db.sh stop"
migrate = { cmd = "python -m django migrate", depends-on = ["db-start"] }

# Insecure, publicly known values for local development only.
[feature.dev.activation.env]
PATCHMANAGER_DEBUG = "true"
DJANGO_SECRET_KEY = "dev-only-insecure-key-never-use-in-production-0123456789"
PATCHMANAGER_ENCRYPTION_KEYS = "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="

[feature.dev.tasks]
dev = { cmd = "python -m django runserver 127.0.0.1:8000", depends-on = ["migrate", "css"] }
worker = "celery -A patchmanager.worker worker --loglevel INFO"

[feature.test.dependencies]
pytest = ">=9.1.1,<10"
pytest-django = ">=4.13.0,<5"
pytest-cov = ">=7.1.0,<8"
hypothesis = ">=6.170.5,<7"
factory_boy = ">=3.3.3,<4"

[feature.test.tasks]
test = { cmd = "pytest", depends-on = ["db-start", "compilemessages"], env = { DJANGO_SETTINGS_MODULE = "tests.settings", PATCHMANAGER_TESTING = "true", PATCHMANAGER_DEBUG = "false", DJANGO_SECRET_KEY = "test-only-insecure-key-0123456789-0123456789-0123456789", PATCHMANAGER_ENCRYPTION_KEYS = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" } }
# Load test with 500 racks and 50 000 ports (PERF_RACKS scales it down).
perf = { cmd = "pytest -m perf tests/perf --no-cov -s -p no:cacheprovider", depends-on = ["db-start", "compilemessages"], env = { DJANGO_SETTINGS_MODULE = "tests.settings", PATCHMANAGER_TESTING = "true", PATCHMANAGER_DEBUG = "false", DJANGO_SECRET_KEY = "test-only-insecure-key-0123456789-0123456789-0123456789", PATCHMANAGER_ENCRYPTION_KEYS = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" } }

# Browser end to end tests (Playwright, Chromium).
[feature.e2e.dependencies]
playwright = ">=1.64.1,<2"
pytest-playwright = ">=0.10.0,<0.11"

[feature.e2e.tasks]
e2e-install = "playwright install chromium"
e2e = { cmd = "pytest -m e2e tests/e2e --no-cov -p no:cacheprovider", depends-on = ["db-start", "css", "compilemessages"], env = { DJANGO_SETTINGS_MODULE = "tests.settings_e2e", DJANGO_ALLOW_ASYNC_UNSAFE = "true", PATCHMANAGER_TESTING = "true", PATCHMANAGER_DEBUG = "false", DJANGO_SECRET_KEY = "test-only-insecure-key-0123456789-0123456789-0123456789", PATCHMANAGER_ENCRYPTION_KEYS = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" } }

[feature.lint.dependencies]
ruff = ">=0.17.1,<0.18"
mypy = ">=2.4.0,<3"
django-stubs = ">=6.1.2,<6.2"
djangorestframework-stubs = ">=3.18.1,<3.19"
pre-commit = ">=4.7.0,<5"
bandit = ">=1.9.4,<2"
pip-audit = ">=2.10.1,<3"

[feature.lint.tasks]
lint = "ruff check . && ruff format --check ."
fmt = "ruff check --fix . && ruff format ."
typecheck = { cmd = "mypy", env = { PATCHMANAGER_TESTING = "true", PATCHMANAGER_ENCRYPTION_KEYS = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=", DJANGO_SECRET_KEY = "typecheck-only-insecure-key-0123456789-0123456789-0123", DATABASE_URL = "postgresql://typecheck@localhost/typecheck" } }
audit = "pip-audit --strict --progress-spinner off && bandit -c pyproject.toml -r src"
pre-commit = "pre-commit run --all-files"

[feature.docs.dependencies]
mkdocs-material = ">=9.7.7,<10"

[feature.docs.tasks]
docs = "mkdocs serve"
docs-build = "mkdocs build --strict"

[feature.prod.tasks]
serve = "gunicorn patchmanager.wsgi:application --config src/patchmanager/gunicorn_conf.py"

# Asset build: translations and Tailwind CSS. Used by dev, test and the image build.
[feature.build.dependencies]
gettext = ">=0.25,<1"

[feature.build.tasks]
css = "python scripts/tailwind.py -i src/patchmanager/core/assets/app.css -o src/patchmanager/core/static/core/app.css --minify"
css-watch = "python scripts/tailwind.py -i src/patchmanager/core/assets/app.css -o src/patchmanager/core/static/core/app.css --watch"
messages = "cd src/patchmanager && django-admin makemessages -l de --ignore 'static/*' --ignore 'core/static/*'"
# No settings needed: compiles every catalog below the current directory.
compilemessages = { cmd = "cd src/patchmanager && django-admin compilemessages", env = { DJANGO_SETTINGS_MODULE = "" } }
assets = { depends-on = ["css", "compilemessages"] }

[tasks.build]
cmd = "docker buildx build --platform linux/amd64,linux/arm64 -t patchmanager:local ."

[environments]
default = { solve-group = "main" }
prod = { features = ["prod"], solve-group = "main" }
build = { features = ["build"], solve-group = "main" }
test = { features = ["test", "db", "build"], solve-group = "main" }
e2e = { features = ["test", "db", "build", "e2e"], solve-group = "main" }
lint = { features = ["lint", "test", "e2e"], solve-group = "main" }
docs = { features = ["docs"], no-default-feature = true }
dev = { features = ["dev", "db", "test", "lint", "docs", "build", "e2e"], solve-group = "main" }
